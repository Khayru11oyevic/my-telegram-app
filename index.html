<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Zone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.07); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .page { display: none; }
        .active { display: block; }
        .anim { transition: 0.3s; }
        .anim:active { transform: scale(0.96); }
    </style>
</head>
<body class="p-4">

    <div class="flex justify-between items-center mb-6">
        <h1 id="title" class="text-xl font-black italic text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-blue-400">PREMIUM ZONE</h1>
        <button id="back-btn" onclick="goBack()" class="hidden bg-white/10 px-3 py-1 rounded-full text-xs"><i class="fa fa-home"></i></button>
    </div>

    <div id="main-page" class="page active space-y-6">
        <section>
            <h2 class="text-[10px] font-bold text-orange-500 uppercase mb-3 tracking-widest"><i class="fa fa-fire"></i> Hot Sotuvlar</h2>
            <div class="grid grid-cols-1 gap-3">
                <div class="glass p-3 rounded-2xl anim flex items-center gap-4" onclick="buyProduct('Premium 1 Oy (Login)', '42,000')">
                    <img src="image_f41efa.jpg" class="w-12 h-12 rounded-xl object-cover">
                    <div class="flex-1"><p class="text-xs font-bold">Premium 1 Oy (Login)</p><p class="text-[10px] text-slate-400">42,000 UZS</p></div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-[10px] font-bold text-slate-400 uppercase mb-3 tracking-widest">Kategoriyalar</h2>
            <div class="grid grid-cols-2 gap-3">
                <div class="glass p-5 rounded-2xl text-center anim" onclick="openPage('login-page', 'Login orqali')">
                    <i class="fa fa-user-lock text-indigo-400 text-xl mb-2"></i><p class="text-[10px] font-bold">Login</p>
                </div>
                <div class="glass p-5 rounded-2xl text-center anim" onclick="openPage('gift-page', 'Gift Link')">
                    <i class="fa fa-gift text-purple-400 text-xl mb-2"></i><p class="text-[10px] font-bold">Gift Link</p>
                </div>
                <div class="glass p-5 rounded-2xl text-center anim" onclick="openPage('stars-page', 'Stars')">
                    <img src="image_f3aada.png" class="w-6 h-6 mx-auto mb-2">
                    <p class="text-[10px] font-bold">Stars</p>
                </div>
            </div>
        </section>
    </div>

    <div id="login-page" class="page space-y-3">
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('Premium 1 Oy (Login)', '42,000')"><span>1 Oy</span><span class="font-bold text-indigo-400">42,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('Premium 1 Yil (Login)', '300,000')"><span>1 Yil</span><span class="font-bold text-indigo-400">300,000 UZS</span></button>
    </div>

    <div id="gift-page" class="page space-y-3">
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('Premium 1 Oy (Gift)', '220,000')"><span>1 Oy</span><span class="font-bold text-purple-400">220,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('Premium 6 Oy (Gift)', '345,000')"><span>6 Oy</span><span class="font-bold text-purple-400">345,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('Premium 12 Oy (Gift)', '550,000')"><span>12 Oy</span><span class="font-bold text-purple-400">550,000 UZS</span></button>
    </div>

    <div id="stars-page" class="page space-y-3">
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('50 Stars', '15,000')"><span>50 Stars</span><span class="font-bold text-yellow-400">15,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('100 Stars', '27,000')"><span>100 Stars</span><span class="font-bold text-yellow-400">27,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('500 Stars', '120,000')"><span>500 Stars</span><span class="font-bold text-yellow-400">120,000 UZS</span></button>
        <button class="glass w-full p-4 rounded-xl flex justify-between items-center" onclick="buyProduct('1000 Stars', '210,000')"><span>1000 Stars</span><span class="font-bold text-yellow-400">210,000 UZS</span></button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function openPage(id, title) {
            document.getElementById('main-page').classList.remove('active');
            document.getElementById(id).classList.add('active');
            document.getElementById('title').innerText = title;
            document.getElementById('back-btn').classList.remove('hidden');
        }

        function goBack() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('main-page').classList.add('active');
            document.getElementById('title').innerText = "PREMIUM ZONE";
            document.getElementById('back-btn').classList.add('hidden');
        }

        function buyProduct(name, price) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({ product_name: name, product_price: price }));
        }
    </script>
</body>
</html>
