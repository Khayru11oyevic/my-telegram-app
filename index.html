<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Zone Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #050505;
            color: white;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gradient-text {
            background: linear-gradient(90deg, #a855f7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .anim-scale:active { transform: scale(0.95); transition: 0.2s; }
        
        .pulse-glow { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(168, 85, 247, 0); }
            100% { box-shadow: 0 0 0 0 rgba(168, 85, 247, 0); }
        }
    </style>
</head>
<body class="p-4">

    <header class="flex justify-between items-center mb-8 pt-4">
        <div>
            <h1 class="text-3xl font-black tracking-tighter">PREMIUM <span class="gradient-text">ZONE</span></h1>
            <p class="text-slate-500 text-sm">Tezkor va xavfsiz xizmat</p>
        </div>
        <div class="w-12 h-12 rounded-full glass flex items-center justify-center pulse-glow">
            <i class="fa-solid fa-gem text-purple-400"></i>
        </div>
    </header>

    <main id="app-container" class="space-y-6">
        
        <section>
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-2">
                <i class="fa-solid fa-fire text-orange-500"></i> Hot Sotuvlar
            </h2>
            <div class="grid grid-cols-1 gap-4">
                <div class="glass p-5 rounded-3xl anim-scale border-l-4 border-orange-500" onclick="buyProduct('Premium 1 Oy (Login) [HOT]', '42,000')">
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-bold">Premium 1 Oy (Login)</p>
                            <p class="text-xs text-slate-400">Tezkor faollashtirish</p>
                        </div>
                        <span class="font-black text-orange-400">42,000 UZS</span>
                    </div>
                </div>
            </div>
        </section>

        <section>
            <h2 class="text-xs font-bold text-slate-400 uppercase mb-3">Kategoriyalar</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="glass p-4 rounded-3xl text-center anim-scale" onclick="showCategory('login')">
                    <i class="fa-solid fa-user-lock text-2xl mb-2 text-indigo-400"></i>
                    <p class="text-xs font-bold">Login</p>
                </div>
                <div class="glass p-4 rounded-3xl text-center anim-scale" onclick="showCategory('gift')">
                    <i class="fa-solid fa-gift text-2xl mb-2 text-purple-400"></i>
                    <p class="text-xs font-bold">Gift Link</p>
                </div>
            </div>
        </section>
    </main>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function buyProduct(name, price) {
            tg.HapticFeedback.impactOccurred('medium'); // Tugma bosilganda vibratsiya
            tg.sendData(JSON.stringify({ product_name: name, product_price: price }));
        }

        function showCategory(type) {
            tg.HapticFeedback.impactOccurred('light');
            alert(type + " kategoriyasi tez orada ochiladi!");
        }
    </script>
</body>
</html>
