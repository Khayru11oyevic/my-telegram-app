<div id="gift-page" class="page space-y-3">
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('Premium 1 Oy (Gift)', '220,000')">
            <p>1 Oylik Gift</p><div class="bg-purple-600 px-4 py-1.5 rounded-full font-bold text-sm">220,000</div>
        </div>
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('Premium 6 Oy (Gift)', '345,000')">
            <p>6 Oylik Gift</p><div class="bg-purple-600 px-4 py-1.5 rounded-full font-bold text-sm">345,000</div>
        </div>
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('Premium 12 Oy (Gift)', '550,000')">
            <p>12 Oylik Gift</p><div class="bg-purple-600 px-4 py-1.5 rounded-full font-bold text-sm">550,000</div>
        </div>
    </div>

    <div id="stars-page" class="page space-y-3">
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('50 Stars', '15,000')">
            <p>50 Stars</p><div class="bg-yellow-600 px-4 py-1.5 rounded-full font-bold text-sm">15,000</div>
        </div>
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('100 Stars', '27,000')">
            <p>100 Stars</p><div class="bg-yellow-600 px-4 py-1.5 rounded-full font-bold text-sm">27,000</div>
        </div>
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('500 Stars', '120,000')">
            <p>500 Stars</p><div class="bg-yellow-600 px-4 py-1.5 rounded-full font-bold text-sm">120,000</div>
        </div>
        <div class="tg-card p-4 flex justify-between items-center" onclick="buyProduct('1000 Stars', '210,000')">
            <p>1000 Stars</p><div class="bg-yellow-600 px-4 py-1.5 rounded-full font-bold text-sm">210,000</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        function openPage(id, title) {
            document.getElementById('main-page').classList.remove('active');
            document.getElementById(id).classList.add('active');
            document.getElementById('title').innerText = title;
            document.getElementById('back-btn').classList.remove('hidden');
        }
        function goBack() {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('main-page').classList.add('active');
            document.getElementById('title').innerText = "Premium Zone";
            document.getElementById('back-btn').classList.add('hidden');
        }
        function buyProduct(name, price) {
            tg.HapticFeedback.impactOccurred('medium');
            tg.sendData(JSON.stringify({ product_name: name, product_price: price }));
        }
    </script>
</body>
</html>
