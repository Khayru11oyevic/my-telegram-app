<!-- TOP BAR -->
<div class="flex items-center justify-between mb-5 px-1">
    
    <!-- Logo / Title -->
    <div>
        <h1 id="title" class="text-2xl font-bold text-white">Premium Zone</h1>
        <p class="text-gray-400 text-sm">Telegram xizmatlari</p>
    </div>

    <!-- User Profile -->
    <div class="flex items-center gap-2 bg-[#1f2937] px-3 py-2 rounded-2xl shadow-lg">
        <img 
            src="https://i.pravatar.cc/100" 
            alt="profile"
            class="w-10 h-10 rounded-full border-2 border-purple-500 object-cover"
        >
        <div class="leading-tight">
            <p class="text-white text-sm font-semibold">@username</p>
            <p class="text-gray-400 text-xs">Online</p>
        </div>
    </div>

</div>

<!-- GIFT PAGE -->
<div id="gift-page" class="page space-y-4">

    <div class="tg-card bg-gradient-to-r from-purple-700 to-purple-500 p-4 rounded-3xl flex justify-between items-center shadow-lg hover:scale-[1.02] transition-all duration-300"
        onclick="buyProduct('Premium 1 Oy (Gift)', '220,000')">

        <div>
            <p class="text-lg font-semibold">1 Oylik Gift</p>
            <p class="text-sm text-purple-100">Telegram Premium</p>
        </div>

        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-bold text-sm">
            220,000
        </div>
    </div>

    <div class="tg-card bg-gradient-to-r from-purple-700 to-pink-500 p-4 rounded-3xl flex justify-between items-center shadow-lg hover:scale-[1.02] transition-all duration-300"
        onclick="buyProduct('Premium 6 Oy (Gift)', '345,000')">

        <div>
            <p class="text-lg font-semibold">6 Oylik Gift</p>
            <p class="text-sm text-pink-100">Mashhur tarif</p>
        </div>

        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-bold text-sm">
            345,000
        </div>
    </div>

    <div class="tg-card bg-gradient-to-r from-indigo-700 to-purple-600 p-4 rounded-3xl flex justify-between items-center shadow-lg hover:scale-[1.02] transition-all duration-300"
        onclick="buyProduct('Premium 12 Oy (Gift)', '550,000')">

        <div>
            <p class="text-lg font-semibold">12 Oylik Gift</p>
            <p class="text-sm text-indigo-100">Eng foydali paket</p>
        </div>

        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-bold text-sm">
            550,000
        </div>
    </div>

</div>

<!-- STARS PAGE -->
<div id="stars-page" class="page space-y-4">

    <div class="tg-card bg-gradient-to-r from-yellow-600 to-orange-500 p-4 rounded-3xl flex justify-between items-center shadow-lg hover:scale-[1.02] transition-all duration-300"
        onclick="buyProduct('50 Stars', '15,000')">

        <div>
            <p class="text-lg font-semibold">50 Stars</p>
            <p class="text-sm text-yellow-100">Boshlang'ich paket</p>
        </div>

        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-bold text-sm">
            15,000
        </div>
    </div>

    <div class="tg-card bg-gradient-to-r from-yellow-500 to-amber-400 p-4 rounded-3xl flex justify-between items-center shadow-lg hover:scale-[1.02] transition-all duration-300"
        onclick="buyProduct('100 Stars', '27,000')">

        <div>
            <p class="text-lg font-semibold">100 Stars</p>
            <p class="text-sm text-yellow-100">Mashhur tanlov</p>
        </div>

        <div class="bg-white/20 backdrop-blur-md px-4 py-2 rounded-full font-bold text-sm">
            27,000
        </div>
    </div>

</div>
